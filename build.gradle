// Root build.gradle
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.1.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10"
        classpath "com.google.gms:google-services:4.3.15"
    }
}

plugins {
    id "com.android.application" version "8.1.1" apply false
    id "com.android.library" version "8.1.1" apply false
    id "org.jetbrains.kotlin.android" version "1.9.10" apply false
}

ext {
    // SDK Versions
    compileSdkVersion = 34
    minSdkVersion = 26
    targetSdkVersion = 34

    // App Versions
    appVersion = "1.0.0"
    appVersionCode = 1

    // Kotlin
    kotlinVersion = "1.9.10"

    // AndroidX
    coreVersion = "1.12.0"
    appCompatVersion = "1.6.1"
    lifecycleVersion = "2.6.2"
    roomVersion = "2.6.1"
    workVersion = "2.8.1"
    pagerVersion = "1.0.0"
    composeVersion = "1.5.4"
    composeMaterialVersion = "1.5.4"

    // Google
    googlePlayServicesVersion = "18.2.0"
    googlePlayServicesLocationVersion = "21.0.1"
    googlePlayServicesMapsVersion = "18.2.0"

    // Firebase
    firebaseBomVersion = "32.4.0"

    // Network
    retrofitVersion = "2.10.0"
    okhttpVersion = "4.11.0"

    // DI
    hiltVersion = "2.47"

    // Testing
    junitVersion = "4.13.2"
    androidxTestVersion = "1.5.0"
    espressoVersion = "3.5.1"
}
